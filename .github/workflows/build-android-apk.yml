name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src-tauri/**"
      - "src/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/build-android-apk.yml"

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK components
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "使用 sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses || true
          "$SDKMGR" "platform-tools" \
                    "platforms;android-34" \
                    "build-tools;34.0.0" \
                    "ndk;27.2.12479018" \
                    "cmake;3.22.1"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Android Rust targets
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Initialize Android project
        run: pnpm tauri android init

      - name: Prepare release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.HGHUB_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.HGHUB_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HGHUB_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.HGHUB_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::缺少 secrets.HGHUB_RELEASE_KEYSTORE_BASE64，无法签名 release 包"
            exit 1
          fi
          ANDROID_DIR=src-tauri/gen/android
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$ANDROID_DIR/hghub-release.keystore"
          {
            echo "storeFile=hghub-release.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=${KEY_ALIAS:-hghub}"
            echo "keyPassword=$KEY_PASSWORD"
          } > "$ANDROID_DIR/keystore.properties"
          node scripts/setup-android-signing.mjs

      # 不加 --apk 时 tauri 会同时构建 APK 和 AAB，这里只要 APK，省一半时间
      - name: Build Android APK (release, signed)
        run: pnpm tauri android build --apk

      - name: Verify APK signature
        run: |
          set -euo pipefail
          APK_DIR=src-tauri/gen/android/app/build/outputs/apk
          UNSIGNED="$(find "$APK_DIR" -name '*-unsigned.apk' | head -1 || true)"
          if [ -n "$UNSIGNED" ]; then
            echo "::error::产出的是未签名包：$UNSIGNED，说明签名配置没有生效"
            exit 1
          fi
          APK="$(find "$APK_DIR" -name '*-release.apk' | head -1)"
          if [ -z "$APK" ]; then
            echo "::error::找不到 release APK，构建产物目录：$APK_DIR"
            exit 1
          fi
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hghub-android-apk-release
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/release/*.apk
